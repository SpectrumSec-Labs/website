# SpectrumSec — Hugo site configuration.
# baseURL is derived from company.domain in params.toml at build time via a
# partial; keep this value in sync for tooling that reads it directly.
baseURL = "https://spectrumsec.eu/"
title = "SpectrumSec"

locale = "en-GB"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = false
capitalizeListTitles = false

# Fail the build on broken internal refs / render errors instead of warning.
[build]
  [[build.cachebusters]]
    source = "assets/css/.*\\.css"
    target = "css"

[minify]
  disableXML = false
  [minify.tdewolff.html]
    keepDocumentTags = true
    keepSpecialComments = true

[pagination]
  pagerSize = 9

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[permalinks]
  [permalinks.page]
    blog = "/blog/:year/:slug/"
  [permalinks.section]
    blog = "/blog/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Security: no raw HTML in markdown content. Authors use shortcodes.
      unsafe = false
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[imaging]
  resampleFilter = "Lanczos"
  quality = 78
  [imaging.exif]
    disableDate = true
    disableLatLong = true

[services]
  [services.rss]
    limit = 30

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
