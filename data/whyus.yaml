  - title: "Evidence over checklists"
    body: "Every finding is reported with reproducible proof and business impact, not a raw CVSS score — and a fix that fits your actual stack."
  - title: "Confidential, EU-based, GDPR-aligned"
    body: "Sensitive data and personal devices are handled in strict confidence under EU data-protection rules: minimal collection, controlled access, nothing kept longer than needed."
  - title: "Reporting your board can read"
    body: "An executive narrative for leadership, a technical appendix for engineers — delivered in the same report."
  - title: "Fixed scope, fixed price"
    body: "A short scoping call, then one firm quote. No hourly billing surprises."
  - title: "Free remediation retest"
    body: "Once you've fixed what we found, we retest the affected areas at no extra cost, within the agreed window."
