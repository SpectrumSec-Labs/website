eyebrow: "Why SpectrumSec"
heading: "Security work you can actually act on"
lead: "Every engagement is run by a senior practitioner and built around one goal: findings that get fixed. That means detail your engineers can work from on Monday morning, and clarity your board can decide on."

pillars:
