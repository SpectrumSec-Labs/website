# Fixture used by the end-to-end test. {{BASE}} is replaced with the test
# server URL at runtime.
sources:
  - id: cisa-kev
    name: "Example KEV"
    url: "{{BASE}}/kev.json"
    kind: json
    tag: ""
    homepage: "{{BASE}}/"
    enabled: true
  - id: example-cert
    name: "Example CERT"
    url: "{{BASE}}/rss.xml"
    kind: rss
    tag: "advisory"
    homepage: "{{BASE}}/"
    enabled: true
  - id: example-ncc
    name: "Example NCC"
    url: "{{BASE}}/atom.xml"
    kind: atom
    tag: "guidance"
    homepage: "{{BASE}}/"
    enabled: true
  - id: disabled-source
    name: "Disabled"
    url: "{{BASE}}/nope.xml"
    kind: rss
    tag: ""
    homepage: "{{BASE}}/"
    enabled: false

limits:
  http_timeout_seconds: 5
  max_response_bytes: 1048576
  max_items_per_source: 10
  user_agent: "newsfetch-test/1.0"
  retention_days: 90
  max_items: 50
