name: update-news

on:
  schedule:
    - cron: "23 */6 * * *" # every 6h, off the hour
  workflow_dispatch:

# The job needs to write a branch and open a PR — nothing more.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Select token
        id: token
        env:
          BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "value=$BOT_TOKEN" >> "$GITHUB_OUTPUT"
            echo "can_automerge=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "can_automerge=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NEWS_BOT_TOKEN not set — PR will open but CI will not run on it and it will not auto-merge. A human must review."
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.value }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/newsfetch/go.mod
          cache-dependency-path: tools/newsfetch/go.sum

      - name: Aggregate feeds
        working-directory: tools/newsfetch
        run: |
          go run -mod=vendor . \
            -feeds ../../config/feeds.yaml \
            -out ../../data/news.json

      - name: Inspect changes
        id: diff
        run: |
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to data/news.json."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Safety: the aggregator must only ever touch data/news.json.
          other="$(git status --porcelain | grep -v ' data/news.json$' || true)"
          if [ -n "$other" ]; then
            echo "other_changes=true" >> "$GITHUB_OUTPUT"
            echo "::error::Aggregator modified files other than data/news.json:"
            echo "$other"
          else
            echo "other_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Threat feed diff" >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat -- data/news.json >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if unexpected files changed
        if: steps.diff.outputs.other_changes == 'true'
        run: exit 1

      - name: Create pull request
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.value }}
          branch: automated/news
          delete-branch: true
          base: main
          add-paths: data/news.json
          commit-message: "chore(news): refresh threat feed"
          title: "chore(news): refresh threat feed"
          labels: |
            automated
            news
          body: |
            Automated update of `data/news.json` by `tools/newsfetch`.

            - Sources: `config/feeds.yaml` (government / CERT allowlist).
            - This PR only touches `data/news.json`. If it shows any other file,
              do **not** merge — investigate the aggregator.
            - Eligible for auto-merge once all checks pass.

            _Generated by `.github/workflows/update-news.yml`._

      - name: Enable auto-merge
        if: >
          steps.cpr.outputs.pull-request-number != '' &&
          steps.token.outputs.can_automerge == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          gh pr merge --squash --auto \
            --repo "${{ github.repository }}" \
            "${{ steps.cpr.outputs.pull-request-number }}"

      - name: Review reminder
        if: >
          steps.cpr.outputs.pull-request-number != '' &&
          steps.token.outputs.can_automerge != 'true'
        run: echo "::notice::PR #${{ steps.cpr.outputs.pull-request-number }} opened. Set NEWS_BOT_TOKEN to enable CI + auto-merge; until then it needs a manual review and merge."
